[project]
name = "airlock"
version = "0.1.0"
description = "A local privacy airlock between your apps and cloud AI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tristan Kim", email = "tristan@cortexys.team" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
# NVIDIA GLiNER-PII as a second local span proposer (AIRLOCK_GLINER=on). `uv sync --extra gliner`
gliner = [
    "gliner>=0.2.29",
    "torch>=2.4",
]

[project.scripts]
airlock = "airlock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airlock"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Spike tooling, cleaned up after the local-model spike finishes.
extend-exclude = ["scripts/local_model"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
markers = ["live: calls the real local model, Token Factory and Tavily using .env (opt-in: -m live)"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
