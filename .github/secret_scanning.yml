# Directories whose "credentials" are fabricated on purpose: they are the inputs the
# detector is measured against, generated by canary() in eval/generate.py or written by
# hand as probe cases. See the note at the end of the README.
#
# GitHub documents this file as closing alerts in these paths and excluding them from
# push protection. It lists it under the advanced secret-scanning features, so on free
# public-repository scanning it may have no effect; the paths are declared here either
# way, and .gitguardian.yaml carries the same list for ggshield.
paths-ignore:
  - "eval/**"
  - "scripts/local_model/**"
  - "airlock/demo/recorded/**"
  - "airlock/demo/presets.py"
  - "airlock/static/index.html"
  - "tests/**"
